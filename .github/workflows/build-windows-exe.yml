name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Compilar con PyInstaller
        run: |
          pyinstaller --onefile --windowed --name DicomAnonymizer anonymizerbatch.py

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: DicomAnonymizer-windows-exe
          path: dist/DicomAnonymizer.exe

      - name: Adjuntar a release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DicomAnonymizer.exe
